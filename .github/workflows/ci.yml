name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go test -race ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build native app
        env:
          CGO_ENABLED: "0"
        run: go tool mygo build -platform linux/amd64 -skip-build-command

  package:
    name: Package ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows/amd64
            out: windows-amd64
            fetch: windows-amd64
          - name: Linux
            platform: linux/amd64
            out: linux-amd64
            fetch: linux-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xz-utils ${{ matrix.name == 'Windows' && 'nsis' || '' }}
      - name: Fetch bundled tools
        run: bash scripts/fetch-tools.sh "${{ matrix.fetch }}"
      - name: Build package
        env:
          CGO_ENABLED: "0"
        run: go tool mygo build -platform "${{ matrix.platform }}" -skip-build-command
      - name: Verify package contents
        shell: bash
        run: |
          test -n "$(find "build/${{ matrix.out }}" -type f -name 'yt-dlp*' -print -quit)"
          test -n "$(find "build/${{ matrix.out }}" -type f -name 'ffmpeg*' -print -quit)"
          if [ "${{ matrix.name }}" = "Windows" ]; then
            test -f "build/windows-amd64/Video Downloader.exe"
            test -n "$(find build/windows-amd64 -maxdepth 1 -type f -name '*Setup*.exe' -print -quit)"
          else
            test -n "$(find build/linux-amd64 -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
            test -n "$(find build/linux-amd64 -maxdepth 1 -type f -name '*.deb' -print -quit)"
            test -f build/linux-amd64/install.sh
          fi
