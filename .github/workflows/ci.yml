name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet / build
        run: |
          go get github.com/egoist/mygo@latest
          go mod tidy
          go build -o /tmp/video-downloader .
