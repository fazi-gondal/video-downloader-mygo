name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build native app
        env:
          CGO_ENABLED: "0"
        run: go tool mygo build -platform linux/amd64 -skip-build-command
