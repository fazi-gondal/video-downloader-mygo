# Build and publish every native installer when the tag matches mygo.json.
# See https://mygo.egoist.dev/docs/github-actions for signing and notarization.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches mygo.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: ubuntu-latest
            platform: windows/amd64
            fetch: windows-amd64
          - name: Windows arm64
            os: ubuntu-latest
            platform: windows/arm64
            fetch: windows-arm64
          - name: Linux amd64
            os: ubuntu-latest
            platform: linux/amd64
            fetch: linux-amd64
          - name: Linux arm64
            os: ubuntu-latest
            platform: linux/arm64
            fetch: linux-arm64
          # macOS bundles only yt-dlp and uses the user's FFmpeg, so the app
          # stays small and cannot ship an unusable bundled dylib.
          - name: macOS arm64
            os: macos-latest
            platform: darwin/arm64
            fetch: darwin-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis unzip xz-utils
      - name: Fetch verified bundled tools
        run: bash scripts/fetch-tools.sh "${{ matrix.fetch }}"
      - name: Verify bundled tools
        shell: bash
        run: |
          case "${{ matrix.fetch }}" in
            windows-*)
              test -f "resources/${{ matrix.fetch }}/bin/yt-dlp.exe"
              test -f "resources/${{ matrix.fetch }}/bin/ffmpeg.exe"
              test -f "resources/${{ matrix.fetch }}/bin/ffprobe.exe"
              ;;
            darwin-*)
              test -x "resources/${{ matrix.fetch }}/bin/yt-dlp"
              test ! -e "resources/${{ matrix.fetch }}/bin/ffmpeg"
              test ! -e "resources/${{ matrix.fetch }}/bin/ffprobe"
              ;;
            *)
              test -x "resources/${{ matrix.fetch }}/bin/yt-dlp"
              test -x "resources/${{ matrix.fetch }}/bin/ffmpeg"
              test -x "resources/${{ matrix.fetch }}/bin/ffprobe"
              ;;
          esac
      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "::warning::MACOS_CERTIFICATE is not configured; building an ad-hoc signed macOS app."
            exit 0
          fi
          if [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ] || [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_APP_PASSWORD:-}" ]; then
            echo "::error::macOS signing secrets are incomplete; set MACOS_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_PASSWORD."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::The imported certificate has no Developer ID Application identity."
            exit 1
          fi
          MACOS_SIGNING_IDENTITY="$identity" NOTARY_KEYCHAIN="$keychain" python3 - <<'PY'
          import json, os
          with open("mygo.json", encoding="utf-8") as f:
              config = json.load(f)
          macos = config.setdefault("macos", {})
          macos["signingIdentity"] = os.environ["MACOS_SIGNING_IDENTITY"]
          macos["notarize"] = {"keychainProfile": "notary", "keychain": os.environ["NOTARY_KEYCHAIN"]}
          with open("mygo.json", "w", encoding="utf-8") as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          echo "Signing macOS app as: $identity"
      - name: Build package
        env:
          GH_TOKEN: ${{ github.token }}
          # MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          CGO_ENABLED: "0"
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Upload package assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Create x64 copies for amd64 installers/archives so users easily recognize Intel/AMD 64-bit support
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            case "$base" in
              *amd64.exe|*amd64.zip|*amd64.tar.gz)
                dir="$(dirname "$file")"
                x64_file="$dir/${base//amd64/x64}"
                if [ ! -f "$x64_file" ]; then
                  cp "$file" "$x64_file"
                fi
                ;;
            esac
          done < <(find build -type f -print0)

          assets=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.dmg|*.zip|*.tar.gz|*.deb|*.AppImage|*/install.sh|install.sh)
                assets+=("$file")
                ;;
            esac
          done < <(find build -type f -print0)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "ERROR: no release assets found under build/" >&2
            find build -type f -print >&2
            exit 1
          fi

          printf 'Uploading %s\n' "${assets[@]}"
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: failed to upload release assets after 3 attempts" >&2
              exit 1
            fi
            echo "Upload attempt $attempt failed, retrying in 5 seconds..."
            sleep 5
          done

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish release after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
