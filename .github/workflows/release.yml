# Build and publish every native installer when the tag matches mygo.json.
# See https://mygo.egoist.dev/docs/github-actions for signing and notarization.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches mygo.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: ubuntu-latest
            platform: windows/amd64
            fetch: windows-amd64
          - name: Windows arm64
            os: ubuntu-latest
            platform: windows/arm64
            fetch: windows-arm64
          - name: Linux amd64
            os: ubuntu-latest
            platform: linux/amd64
            fetch: linux-amd64
          - name: Linux arm64
            os: ubuntu-latest
            platform: linux/arm64
            fetch: linux-arm64
          # macOS helper binaries are installed by Homebrew on an Apple Silicon runner.
          - name: macOS arm64
            os: macos-latest
            platform: darwin/arm64
            fetch: darwin-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis unzip xz-utils
      - name: Fetch verified bundled tools
        run: bash scripts/fetch-tools.sh "${{ matrix.fetch }}"
      - name: Verify bundled tools
        shell: bash
        run: |
          if [[ "${{ matrix.fetch }}" == windows-* ]]; then
            test -f "resources/${{ matrix.fetch }}/bin/yt-dlp.exe"
            test -f "resources/${{ matrix.fetch }}/bin/ffmpeg.exe"
            test -f "resources/${{ matrix.fetch }}/bin/ffprobe.exe"
          else
            test -x "resources/${{ matrix.fetch }}/bin/yt-dlp"
            test -x "resources/${{ matrix.fetch }}/bin/ffmpeg"
            test -x "resources/${{ matrix.fetch }}/bin/ffprobe"
          fi
      - name: Build package
        env:
          GH_TOKEN: ${{ github.token }}
          # MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          CGO_ENABLED: "0"
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Upload package assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Create x64 copies for amd64 installers/archives so users easily recognize Intel/AMD 64-bit support
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            case "$base" in
              *amd64.exe|*amd64.zip|*amd64.tar.gz)
                dir="$(dirname "$file")"
                x64_file="$dir/${base//amd64/x64}"
                if [ ! -f "$x64_file" ]; then
                  cp "$file" "$x64_file"
                fi
                ;;
            esac
          done < <(find build -type f -print0)

          assets=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.dmg|*.zip|*.tar.gz|*.deb|*.AppImage|*/install.sh|install.sh)
                assets+=("$file")
                ;;
            esac
          done < <(find build -type f -print0)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "ERROR: no release assets found under build/" >&2
            find build -type f -print >&2
            exit 1
          fi

          printf 'Uploading %s\n' "${assets[@]}"
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish release after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
